name: gh-traffic-stats
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Fetch Analytics and Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          import requests
          from datetime import datetime

          # Setup API Call
          repo = os.getenv('GITHUB_REPOSITORY')
          token = os.getenv('GITHUB_TOKEN')
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }
          
          # Fetch Traffic
          url = f"https://api.github.com/repos/{repo}/traffic/views"
          response = requests.get(url, headers=headers).json()
          
          # Get current totals (default to 0 if empty)
          total_views = response.get('count', 0)
          total_uniques = response.get('uniques', 0)
          current_date = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')

          # Create the markdown log row
          new_row = f"| {current_date} | {total_views} | {total_uniques} |\n"

          # Read current README
          readme_path = "README.md"
          if os.path.exists(readme_path):
              with open(readme_path, "r") as f:
                  content = f.read()
          else:
              content = "# Portfolio\n\n## Repository Traffic Stats\n| Date | Total Page Views | Unique Visitors |\n| --- | --- | --- |\n"

          # Append the data row gracefully
          if "## Repository Traffic Stats" not in content:
              content += "\n\n## Repository Traffic Stats\n| Date | Total Page Views | Unique Visitors |\n| --- | --- | --- |\n"
          
          content += new_row

          # Write it back
          with open(readme_path, "w") as f:
              f.write(content)
          print("Successfully logged analytics data directly to README.")
        shell: python

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "analytics: logged latest profile traffic metrics" || exit 0
          git push origin main
