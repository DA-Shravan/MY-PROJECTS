name: gh-traffic-stats
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # Explicitly allows reading internal repository actions/metrics
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Save Traffic Log
        run: |
          mkdir -p analytics
          echo "Log Entry: $(date)" >> analytics/views_log.txt
          
          # Fetch Views
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views" > analytics/raw_views.json
            
          # Fetch Clones (Let's track lifetime clones too!)
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones" > analytics/raw_clones.json

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/
          git commit -m "analytics: logged latest view and clone metrics cleanly" || exit 0
          git push origin main
