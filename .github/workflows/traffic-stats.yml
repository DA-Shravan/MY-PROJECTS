name: gh-traffic-stats
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Fetch Traffic Stats
        uses: wjdp/html-stats-action@v1.1.0
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
